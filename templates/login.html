{% extends 'base.html' %}

{% block content %}
    <h2 class="loginheader">Login</h2>
    <form method="POST">
        <table align="center">
            <tr class="reglog-box">
                <td align="right"><label>Username/email:</label></td>
                <td align="left"><input type="text" name="login" required></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>Password:</label></td>
                <td align="left"><input type="password" name="password" required></td>
            </tr>
        </table>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <center>
        <button style="display: block;margin: 1em;" type="submit">Login</button><a href="{{ url_for('main.register') }}">Need an account? Register</a>
    </center>

{% endblock %}
