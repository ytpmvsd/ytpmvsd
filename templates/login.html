{% extends 'base.html' %}

{% block content %}
    <h2 class="loginheader">{{ _("login_header") }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <table align="center">
            <tr class="reglog-box">
                <td align="right"><label>{{ _("login_label_username_or_email") }}:</label></td>
                <td align="left"><input type="text" name="login" required></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _("form_label_password") }}:</label></td>
                <td align="left"><input type="password" name="password" required></td>
            </tr>
        </table>
        <center>
            <button style="display: block;margin: 1em;" type="submit">{{ _("login_button") }}</button><a href="{{ url_for('main.register') }}">{{ _("login_register_link") }}</a>
        </center>
    </form>

{% endblock %}
