{% extends 'base.html' %}

{% block content %}
    <h2 class="loginheader">{{ _("register_header") }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <table align="center">
            <tr class="reglog-box">
                <td align="right"><label>{{ _("form_label_username") }}</label></td>
                <td align="left"><input type="text" name="username" required /></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _("form_label_email") }}</label></td>
                <td align="left"><input type="email" name="email" required /></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _("form_label_password") }}</label></td>
                <td align="left"><input type="password" name="password" required /></td>
            </tr>
        </table>
        <center>
            <button style="display: block;margin: 1em;" type="submit">{{ _("register_button") }}</button><a href="{{ url_for('main.login') }}">{{ _("register_login_link") }}</a>
        </center>
    </form>

{% endblock %}
